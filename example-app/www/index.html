<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LocalNotifications Cordova Test</title>
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; margin: 1rem; }
      button { display: block; width: 100%; padding: 0.9rem; margin: 0.4rem 0; font-size: 1rem; }
      pre { background: #111; color: #0f0; padding: 0.75rem; border-radius: 6px;
            white-space: pre-wrap; word-break: break-word; min-height: 6rem; }
    </style>
  </head>
  <body>
    <h1>cordova-outsystems-local-notifications — test</h1>
    <button onclick="run('schedule')">schedule() — in 5s, badge 3, foreground</button>
    <button onclick="run('scheduleExact')">schedule() exactAlarm:true (+15s)</button>
    <button onclick="run('update')">update() — same id, new title</button>
    <button onclick="run('getAll')">getAll()</button>
    <button onclick="run('getAllScheduled')">getAll({state:'SCHEDULED'})</button>
    <button onclick="run('getByIds')">getByIds({ids:[1]})</button>
    <button onclick="run('cancel')">cancel({notifications:[{id:1}]})</button>
    <button onclick="run('cancelAll')">cancelAll()</button>
    <button onclick="run('removeDeliveredNotificationsById')">removeDeliveredNotificationsById({ids:[1]})</button>
    <button onclick="run('removeAllDeliveredNotifications')">removeAllDeliveredNotifications()</button>
    <pre id="out">Loading cordova.js…</pre>
    <script src="cordova.js"></script>
    <script>
      function show(label, data) {
        document.getElementById('out').textContent = label + '\n' + JSON.stringify(data, null, 2);
      }
      function sampleFor(method) {
        var at = new Date(Date.now() + 5000).toISOString();
        switch (method) {
          case 'scheduleExact':
            return ['schedule', { notifications: [{ id: 2, title: 'Exact', body: 'Exact alarm', schedule: { at: new Date(Date.now() + 15000).toISOString() }, badge: 1 }], exactAlarm: true }];
          case 'schedule':
            return ['schedule', { notifications: [{ id: 1, title: 'Hello', body: 'Scheduled', schedule: { at: at }, badge: 3, foreground: true }] }];
          case 'update':
            return ['update', { notifications: [{ id: 1, title: 'Updated', body: 'Updated body', schedule: { at: at } }] }];
          case 'getAll': return ['getAll', {}];
          case 'getAllScheduled': return ['getAll', { state: 'SCHEDULED' }];
          case 'getByIds': return ['getByIds', { ids: [1] }];
          case 'cancel': return ['cancel', { notifications: [{ id: 1 }] }];
          case 'cancelAll': return ['cancelAll', null];
          case 'removeDeliveredNotificationsById': return ['removeDeliveredNotificationsById', { ids: [1] }];
          case 'removeAllDeliveredNotifications': return ['removeAllDeliveredNotifications', null];
          default: return [method, {}];
        }
      }
      function run(method) {
        var spec = sampleFor(method), fn = spec[0], opts = spec[1];
        document.getElementById('out').textContent = fn + '() …';
        var P = window.cordova && window.cordova.plugins && window.cordova.plugins.LocalNotifications;
        if (!P) { show('ERROR', 'LocalNotifications not available (wait for deviceready / run on device).'); return; }
        var call = opts == null ? P[fn]() : P[fn](opts);
        Promise.resolve(call).then(function (r) { show('✅ ' + fn, r); }).catch(function (e) { show('❌ ' + fn, e); });
      }
      document.addEventListener('deviceready', function () {
        var P = window.cordova && window.cordova.plugins && window.cordova.plugins.LocalNotifications;
        if (P) {
          P.addListener('localNotificationReceived', function (n) { show('📥 received', n); });
          P.addListener('localNotificationActionPerformed', function (a) { show('👆 actionPerformed', a); });
        }
        document.getElementById('out').textContent = 'Ready — tap a method.';
      });
    </script>
  </body>
</html>
